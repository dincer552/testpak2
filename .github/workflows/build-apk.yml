name: Build, sign and publish Sunny Sip Bar 3D

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: sunny-sip-bar-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-sign-release:
    name: Build Godot 3D, verify, sign and publish APK
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      APK_SIGNING_SERVICE_URL: https://signer.dinceryuksek.com

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0 platform-tools"

      - name: Download Godot 4.7.2 editor
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot"
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 3 \
            "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip" \
            -o "$RUNNER_TEMP/godot-editor.zip"
          unzip -q "$RUNNER_TEMP/godot-editor.zip" -d "$RUNNER_TEMP/godot"
          GODOT_BIN="$(find "$RUNNER_TEMP/godot" -maxdepth 2 -type f -name 'Godot_v4.7.2-stable_linux.x86_64' -print -quit)"
          test -n "$GODOT_BIN"
          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"

      - name: Restore Godot Android export templates
        id: godot-templates
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates/4.7.2.stable
          key: godot-android-templates-4.7.2-stable-linux-arm64

      - name: Install Godot Android export templates
        if: steps.godot-templates.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          GODOT_TEMPLATES="$RUNNER_TEMP/godot-templates"
          mkdir -p "$GODOT_TEMPLATES" "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 3 \
            "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz" \
            -o "$RUNNER_TEMP/godot-templates.tpz"
          unzip -q "$RUNNER_TEMP/godot-templates.tpz" -d "$GODOT_TEMPLATES"
          TEMPLATE_ROOT="$GODOT_TEMPLATES/templates"
          if [ ! -d "$TEMPLATE_ROOT" ]; then
            TEMPLATE_ROOT="$GODOT_TEMPLATES"
          fi
          cp -a "$TEMPLATE_ROOT/." "$HOME/.local/share/godot/export_templates/4.7.2.stable/"
          test -s "$HOME/.local/share/godot/export_templates/4.7.2.stable/android_release.apk"
          test -s "$HOME/.local/share/godot/export_templates/4.7.2.stable/android_debug.apk"

      - name: Configure Godot Android SDK paths
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF

      - name: Validate Godot project and export unsigned APK
        shell: bash
        run: |
          set -euo pipefail
          APP_VERSION_CODE="$GITHUB_RUN_NUMBER"
          APP_VERSION_NAME="1.0.$GITHUB_RUN_NUMBER"
          sed -i "s/^version\/code=.*/version\/code=$APP_VERSION_CODE/" godot/export_presets.cfg
          sed -i "s/^version\/name=.*/version\/name=\"$APP_VERSION_NAME\"/" godot/export_presets.cfg
          "$GODOT_BIN" --headless --editor --path godot --quit
          GODOT_EXPORT_DIR="$RUNNER_TEMP/godot-export"
          mkdir -p "$GODOT_EXPORT_DIR"
          echo "GODOT_EXPORT_DIR=$GODOT_EXPORT_DIR" >> "$GITHUB_ENV"
          "$GODOT_BIN" --headless --path godot --export-release "Android" "$GODOT_EXPORT_DIR/testpak2-unsigned.apk"
          test -s "$GODOT_EXPORT_DIR/testpak2-unsigned.apk"
          BADGING="$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$GODOT_EXPORT_DIR/testpak2-unsigned.apk")"
          echo "$BADGING" | grep -F "package: name='com.dincer552.testpak2' versionCode='$APP_VERSION_CODE'"
          echo "UNSIGNED_APK=$GODOT_EXPORT_DIR/testpak2-unsigned.apk" >> "$GITHUB_ENV"
          echo "APP_VERSION_CODE=$APP_VERSION_CODE" >> "$GITHUB_ENV"
          echo "APP_VERSION_NAME=$APP_VERSION_NAME" >> "$GITHUB_ENV"

      - name: Validate central signer
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 2 \
            "${APK_SIGNING_SERVICE_URL%/}/health" -o "$RUNNER_TEMP/signer-health.json"
          grep -q '"ok":true' "$RUNNER_TEMP/signer-health.json"
          grep -q '"oidc":true' "$RUNNER_TEMP/signer-health.json"

      - name: Obtain short-lived GitHub OIDC token
        id: oidc
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          RESPONSE="$(curl --fail --silent --show-error \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=socialworst-apk-signer")"
          TOKEN="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<< "$RESPONSE")"
          test -n "$TOKEN"
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Sign APK with existing central signing key
        if: steps.oidc.outcome == 'success'
        env:
          SIGNING_OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -X POST "${APK_SIGNING_SERVICE_URL%/}/v1/sign" \
            -H "Authorization: Bearer $SIGNING_OIDC_TOKEN" \
            -F "key_id=testpak2" \
            -F "apk=@$UNSIGNED_APK;type=application/vnd.android.package-archive" \
            -o "$RUNNER_TEMP/testpak2-signed.apk"
          test -s "$RUNNER_TEMP/testpak2-signed.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$RUNNER_TEMP/testpak2-signed.apk"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -p 4 "$RUNNER_TEMP/testpak2-signed.apk"
          BADGING="$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$RUNNER_TEMP/testpak2-signed.apk")"
          echo "$BADGING" | grep -F "package: name='com.dincer552.testpak2' versionCode='$APP_VERSION_CODE'"
          mkdir -p release
          cp "$RUNNER_TEMP/testpak2-signed.apk" release/testpak2.apk
          sha256sum release/testpak2.apk > release/testpak2.apk.sha256
          cat release/testpak2.apk.sha256

      - name: Publish signed Sunny Sip Bar APK
        if: steps.oidc.outcome == 'success'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION_NAME }}
          name: Sunny Sip Bar ${{ env.APP_VERSION_NAME }} — 3D
          target_commitish: main
          make_latest: true
          generate_release_notes: true
          files: |
            release/testpak2.apk
            release/testpak2.apk.sha256
          fail_on_unmatched_files: true

      - name: Upload signed APK artifact
        if: steps.oidc.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: sunny-sip-bar-3d-signed-${{ env.APP_VERSION_NAME }}
          path: |
            release/testpak2.apk
            release/testpak2.apk.sha256
          if-no-files-found: error
          retention-days: 90
